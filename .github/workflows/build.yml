name: Morphe Patch Builder
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - yt
          - ytm
          - gphotos
  schedule:
    - cron: '0 19 * * 0'   # Senin 02:00 WIB = Minggu 19:00 UTC

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install rclone
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF_B64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Download tools (morphe-desktop + patches + aapt2)
        run: |
          JAR_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | grep browser_download_url | grep all.jar | cut -d'"' -f4)
          curl -sL -o morphe-desktop.jar "$JAR_URL"
          MPP_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | grep browser_download_url | grep .mpp | cut -d'"' -f4)
          curl -sL -o patches.mpp "$MPP_URL"
          MPP_TAG=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "MPP_TAG=$MPP_TAG" >> $GITHUB_ENV
          # aapt2 x86_64 from official Android SDK build-tools
          curl -sL -o bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -o -j bt.zip '*/aapt2' -d . 
          chmod +x aapt2 morphe-desktop.jar

      - name: Patch YT + YTM
        run: |
          set -e
          mkdir -p out keystore
          echo "${{ secrets.MORPHE_KEYSTORE_B64 }}" | base64 -d > keystore/Morphe.keystore
          chmod +x build.sh
          ./build.sh "$MPP_TAG" "${{ github.event.inputs.target || 'auto' }}"

      - name: Upload to Google Drive
        run: |
          set -e
          for f in out/*.apk; do
            case "$(basename "$f")" in
              Google_Photos_*)     DIR="GPhotos" ;;
              YouTube_Music-*exp*) DIR="YTM/Experimental" ;;
              YouTube_Music-*)     DIR="YTM/Stable" ;;
              YouTube-*exp*)       DIR="YT/Experimental" ;;
              YouTube-*)           DIR="YT/Stable" ;;
            esac
            rclone copy "$f" "gdrive:Aplikasi Premium/$DIR" --drive-chunk-size 256M
            echo "uploaded $(basename "$f") -> $DIR"
          done

      - name: Summary
        run: |
          echo "## Build results (MPP $MPP_TAG)" >> $GITHUB_STEP_SUMMARY
          ls -lh out/ >> $GITHUB_STEP_SUMMARY
